name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest
      - run: uv build --wheel
      - run: cd dist && sha256sum *.whl > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
